<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frosted</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000000;
    }
    iframe {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <iframe 
    src="https://melted.ai.studio/" 
    title="Melted AI Studio"
    allow="camera; microphone; fullscreen; display-capture; geolocation; autoplay; clipboard-read; clipboard-write; picture-in-picture; web-share; encrypted-media; midi; accelerometer; gyroscope; magnetometer; payment; vr; xr-spatial-tracking; screen-wake-lock; focus-without-user-activation; cross-origin-isolated"
    allowfullscreen="true"
    webkitallowfullscreen="true"
    mozallowfullscreen="true">
  </iframe>

</body>
</html>
