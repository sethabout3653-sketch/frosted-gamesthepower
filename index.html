<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">

  <title>FrostHub</title>

  <!-- Favicon References -->
  <link id="dynamic-favicon" rel="icon" type="image/png" href="favicon.png">
  <link id="dynamic-shortcut-icon" rel="shortcut icon" type="image/png" href="favicon.png">
  <link id="dynamic-apple-icon" rel="apple-touch-icon" href="favicon.png">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      position: fixed;
      inset: 0;
    }

    .embed-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100vh;
      height: 100dvh;
      min-width: 100%;
      min-height: 100%;
      overflow: hidden;
      background: #000;
    }

    iframe {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      min-width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      background: #000;
    }

    @supports (height: 100svh) {
      .embed-container {
        height: 100svh;
        height: 100dvh;
      }
    }
  </style>
</head>

<body>

  <main class="embed-container">
    <iframe
      id="embedded-frame"
      src="https://melted.sethabout3653.workers.dev/"
      title="Melted AI Studio"
      allow="
        camera;
        microphone;
        fullscreen;
        display-capture;
        geolocation;
        autoplay;
        clipboard-read;
        clipboard-write;
        picture-in-picture;
        web-share;
        encrypted-media;
        midi;
        accelerometer;
        gyroscope;
        magnetometer;
        payment;
        vr;
        xr-spatial-tracking;
        screen-wake-lock;
        focus-without-user-activation;
        cross-origin-isolated
      "
      allowfullscreen
      webkitallowfullscreen
      mozallowfullscreen>
    </iframe>
  </main>

  <script>
    (function () {
      const iframe = document.getElementById('embedded-frame');
      const ALLOWED_ORIGIN = 'https://melted.sethabout3653.workers.dev';

      function setFavicon(href) {
        if (typeof href !== 'string' || href.trim() === '') return;

        let resolvedUrl = href.trim();
        try {
          resolvedUrl = new URL(resolvedUrl, ALLOWED_ORIGIN).href;
        } catch (_) {
          // Keep data: URIs or raw strings as-is
        }

        document.querySelectorAll('link[rel*="icon"]').forEach((el) => el.remove());

        ['icon', 'shortcut icon', 'apple-touch-icon'].forEach((rel) => {
          const link = document.createElement('link');
          link.rel = rel;
          link.href = resolvedUrl;
          document.head.appendChild(link);
        });
      }

      function applyMetadata(payload) {
        if (!payload || typeof payload !== 'object') return;

        if (typeof payload.title === 'string' && payload.title.trim() !== '') {
          document.title = payload.title;
        }

        const iconUrl = payload.favicon || payload.icon;
        if (typeof iconUrl === 'string' && iconUrl.trim() !== '') {
          setFavicon(iconUrl);
        }
      }

      // Cross-origin postMessage bridge (Approach #1)
      window.addEventListener('message', (event) => {
        if (event.origin !== ALLOWED_ORIGIN) return;
        const data = event.data;
        if (!data || typeof data !== 'object') return;

        if (
          data.type === 'TAB_METADATA_UPDATE' ||
          data.type === 'CLOAK_UPDATE' ||
          'title' in data ||
          'favicon' in data ||
          'icon' in data
        ) {
          applyMetadata(data);
        }
      });

      // Same-origin fallback (if ever served from the same origin)
      iframe.addEventListener('load', () => {
        try {
          const doc = iframe.contentDocument || iframe.contentWindow.document;
          if (!doc || !doc.head) return;

          const syncDoc = () => {
            const iconEl = doc.querySelector('link[rel*="icon"]');
            applyMetadata({
              title: doc.title,
              favicon: iconEl ? iconEl.href : ''
            });
          };

          syncDoc();

          const observer = new MutationObserver(syncDoc);
          observer.observe(doc.head, {
            childList: true,
            subtree: true,
            attributes: true,
            characterData: true
          });
        } catch (_) {
          // Expected when cross-origin; postMessage handles updates
        }
      });
    })();
  </script>

</body>
</html>
