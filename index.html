<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">

  <title>FrostHub</title>

  <!-- Favicon References -->
  <link id="dynamic-favicon" rel="icon" type="image/svg+xml" href="https://melted.sethabout3653.workers.dev/assets/cloaks/frosthub.svg">
  <link id="dynamic-shortcut-icon" rel="shortcut icon" type="image/svg+xml" href="https://melted.sethabout3653.workers.dev/assets/cloaks/frosthub.svg">
  <link id="dynamic-apple-icon" rel="apple-touch-icon" href="https://melted.sethabout3653.workers.dev/assets/cloaks/frosthub.svg">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      position: fixed;
      inset: 0;
    }

    .embed-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100vh;
      height: 100dvh;
      min-width: 100%;
      min-height: 100%;
      overflow: hidden;
      background: #000;
    }

    iframe {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      min-width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      background: #000;
    }

    @supports (height: 100svh) {
      .embed-container {
        height: 100svh;
        height: 100dvh;
      }
    }
  </style>
</head>

<body>

  <main class="embed-container">
    <iframe
      id="embedded-frame"
      src="https://melted.sethabout3653.workers.dev/"
      title="Melted AI Studio"
      allow="
        camera;
        microphone;
        fullscreen;
        display-capture;
        geolocation;
        autoplay;
        clipboard-read;
        clipboard-write;
        picture-in-picture;
        web-share;
        encrypted-media;
        midi;
        accelerometer;
        gyroscope;
        magnetometer;
        payment;
        vr;
        xr-spatial-tracking;
        screen-wake-lock;
        focus-without-user-activation;
        cross-origin-isolated
      "
      allowfullscreen
      webkitallowfullscreen
      mozallowfullscreen>
    </iframe>
  </main>

  <script>
    (function () {
      const iframe = document.getElementById('embedded-frame');
      const ALLOWED_ORIGIN = 'https://melted.sethabout3653.workers.dev';

      let lastAppliedTitle = document.title;
      let lastAppliedFavicon = '';

      function normalizeOrigin(origin) {
        if (!origin || typeof origin !== 'string') return '';
        return origin.replace(/\/+$/, '').toLowerCase();
      }

      function resolveFaviconUrl(rawUrl, fallbackBase) {
        if (!rawUrl || typeof rawUrl !== 'string') return '';
        const trimmed = rawUrl.trim();
        if (!trimmed) return '';

        if (
          trimmed.startsWith('data:') ||
          trimmed.startsWith('blob:') ||
          trimmed.startsWith('http://') ||
          trimmed.startsWith('https://')
        ) {
          return trimmed;
        }

        try {
          return new URL(trimmed, fallbackBase || ALLOWED_ORIGIN).href;
        } catch (_) {
          return trimmed;
        }
      }

      function applyFavicon(rawUrl, fallbackBase) {
        const resolved = resolveFaviconUrl(rawUrl, fallbackBase);
        if (!resolved || resolved === lastAppliedFavicon) return;

        lastAppliedFavicon = resolved;

        const isSvg = resolved.includes('.svg') || resolved.includes('image/svg+xml');
        const mimeType = isSvg ? 'image/svg+xml' : 'image/png';

        // Add a query cache-buster for HTTP/HTTPS URLs so browsers repaint immediately
        let finalHref = resolved;
        if (!resolved.startsWith('data:') && !resolved.startsWith('blob:')) {
          const sep = resolved.includes('?') ? '&' : '?';
          finalHref = `${resolved}${sep}_cb=${Date.now()}`;
        }

        // Clean out previous link icons
        document.querySelectorAll('link[rel*="icon"]').forEach((el) => el.remove());

        // Re-inject fresh link elements with proper MIME types
        ['icon', 'shortcut icon', 'apple-touch-icon'].forEach((rel) => {
          const link = document.createElement('link');
          link.rel = rel;
          link.type = mimeType;
          link.href = finalHref;
          document.head.appendChild(link);
        });
      }

      function applyTitle(newTitle) {
        if (typeof newTitle !== 'string') return;
        const clean = newTitle.trim();
        if (!clean || clean === lastAppliedTitle) return;
        lastAppliedTitle = clean;
        document.title = clean;
      }

      function handleMetadataPayload(data, sourceOrigin) {
        if (!data || typeof data !== 'object') return;

        const title = data.title ?? data.tabTitle ?? data.cloakTitle;
        const icon = data.favicon ?? data.icon ?? data.tabIcon ?? data.cloakIcon;

        if (typeof title === 'string') {
          applyTitle(title);
        }
        if (typeof icon === 'string') {
          applyFavicon(icon, sourceOrigin || ALLOWED_ORIGIN);
        }
      }

      // Listen for messages from the embedded worker frame
      window.addEventListener('message', (event) => {
        const incoming = normalizeOrigin(event.origin);
        const expected = normalizeOrigin(ALLOWED_ORIGIN);

        // Allow exact worker domain or local/dev previews
        const isAllowed =
          !incoming ||
          incoming === expected ||
          incoming.endsWith('.workers.dev') ||
          incoming.includes('run.app') ||
          incoming.includes('localhost');

        if (!isAllowed) return;

        handleMetadataPayload(event.data, event.origin);
      });

      // Same-origin fallback
      function attachSameOriginWatchers() {
        try {
          const doc = iframe.contentDocument || (iframe.contentWindow && iframe.contentWindow.document);
          if (!doc || !doc.head) return;

          const syncNow = () => {
            const iconEl =
              doc.querySelector('link[rel="icon"]') ||
              doc.querySelector('link[rel="shortcut icon"]') ||
              doc.querySelector('link[rel*="icon"]');

            handleMetadataPayload(
              {
                title: doc.title,
                favicon: iconEl ? iconEl.getAttribute('href') || iconEl.href : ''
              },
              doc.location ? doc.location.origin : ALLOWED_ORIGIN
            );
          };

          syncNow();

          const observer = new MutationObserver(syncNow);
          observer.observe(doc.head, {
            childList: true,
            subtree: true,
            attributes: true,
            characterData: true
          });
        } catch (_) {}
      }

      function requestChildMetadata() {
        if (iframe.contentWindow) {
          iframe.contentWindow.postMessage({ type: 'REQUEST_TAB_METADATA' }, '*');
        }
      }

      iframe.addEventListener('load', () => {
        attachSameOriginWatchers();
        requestChildMetadata();
        // Retry shortly after load to ensure child framework hydrated
        setTimeout(requestChildMetadata, 300);
        setTimeout(requestChildMetadata, 1000);
      });
    })();
  </script>

</body>
</html>
