<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">

  <title>FrostHub</title>

  <!-- Favicon References -->
  <link rel="icon" type="image/png" href="frosthub.png">
  <link rel="shortcut icon" type="image/png" href="frosthub.png">
  <link rel="apple-touch-icon" href="frosthubfavicon.png">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      position: fixed;
      inset: 0;
    }

    .embed-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100vh;
      height: 100dvh;
      min-width: 100%;
      min-height: 100%;
      overflow: hidden;
      background: #000;
    }

    iframe {
      position: absolute;
      inset: 0;
      display: block;

      width: 100%;
      height: 100%;

      min-width: 100%;
      min-height: 100%;

      margin: 0;
      padding: 0;
      border: 0;

      background: #000;
    }

    @supports (height: 100svh) {
      .embed-container {
        height: 100svh;
        height: 100dvh;
      }
    }
  </style>
</head>

<body>

  <main class="embed-container">
    <iframe
      src="https://melted.ai.studio/"
      title="Melted AI Studio"
      allow="
        camera;
        microphone;
        fullscreen;
        display-capture;
        geolocation;
        autoplay;
        clipboard-read;
        clipboard-write;
        picture-in-picture;
        web-share;
        encrypted-media;
        midi;
        accelerometer;
        gyroscope;
        magnetometer;
        payment;
        vr;
        xr-spatial-tracking;
        screen-wake-lock;
        focus-without-user-activation;
        cross-origin-isolated
      "
      allowfullscreen
      webkitallowfullscreen
      mozallowfullscreen>
    </iframe>
  </main>

</body>
</html>
